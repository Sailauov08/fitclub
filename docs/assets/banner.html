<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FITCLUB banner</title>
    <!-- Source for docs/assets/banner.png — rendered by scripts/render-banner.mjs -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Unbounded:wght@600;700&display=block"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #0e0f0d;
        --bone: #f3efe7;
        --ember: #e8562a;
        --muted: #a19e96;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1600px;
        height: 640px;
        overflow: hidden;
        background: var(--ink);
        color: var(--bone);
        font-family: Inter, sans-serif;
        position: relative;
      }
      .glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(900px 500px at 78% 40%, rgba(232, 86, 42, 0.22), transparent 60%),
          radial-gradient(600px 400px at 10% 110%, rgba(232, 86, 42, 0.12), transparent 60%);
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(243, 239, 231, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(243, 239, 231, 0.045) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: linear-gradient(90deg, #000 0%, transparent 70%);
      }
      .copy {
        position: absolute;
        left: 88px;
        top: 96px;
        width: 640px;
      }
      .logo {
        font-family: Unbounded, sans-serif;
        font-weight: 700;
        font-size: 30px;
        letter-spacing: -0.5px;
        display: flex;
        align-items: flex-end;
        gap: 4px;
      }
      .logo i {
        width: 12px;
        height: 12px;
        background: var(--ember);
        display: inline-block;
        margin-bottom: 7px;
      }
      h1 {
        font-family: Unbounded, sans-serif;
        font-weight: 700;
        font-size: 64px;
        line-height: 1.02;
        letter-spacing: -2px;
        margin-top: 44px;
      }
      h1 em {
        font-style: normal;
        color: var(--ember);
      }
      p {
        margin-top: 26px;
        font-size: 21px;
        line-height: 1.5;
        color: var(--muted);
        width: 560px;
      }
      .chips {
        margin-top: 34px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .chip {
        border: 1px solid rgba(243, 239, 231, 0.18);
        border-radius: 999px;
        padding: 8px 16px;
        font-size: 15px;
        font-weight: 500;
        color: var(--bone);
        background: rgba(243, 239, 231, 0.04);
      }
      .chip b {
        color: var(--ember);
        font-weight: 600;
      }
      .shot {
        position: absolute;
        border-radius: 14px;
        overflow: hidden;
        border: 1px solid rgba(243, 239, 231, 0.14);
        box-shadow:
          0 40px 80px rgba(0, 0, 0, 0.55),
          0 0 0 1px rgba(0, 0, 0, 0.4);
        background: #111;
      }
      .shot img {
        display: block;
        width: 100%;
      }
      .desk {
        width: 760px;
        left: 790px;
        top: 70px;
        transform: perspective(1800px) rotateY(-10deg) rotateX(3deg);
      }
      .desk2 {
        width: 620px;
        left: 960px;
        top: 300px;
        transform: perspective(1800px) rotateY(-10deg) rotateX(3deg);
      }
      .phone {
        width: 220px;
        left: 760px;
        top: 250px;
        border-radius: 30px;
        border: 6px solid #1c1d1b;
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid"></div>
    <div class="copy">
      <div class="logo">FITCLUB<i></i></div>
      <h1>Fitness club<br />platform, <em>end&nbsp;to&nbsp;end.</em></h1>
      <p>Public website, member portal and admin back office on one API, one database and one permission model.</p>
      <div class="chips">
        <span class="chip"><b>kk</b> · ru · en</span>
        <span class="chip">Next.js 16</span>
        <span class="chip">NestJS 11</span>
        <span class="chip">PostgreSQL</span>
        <span class="chip">Vercel + Neon</span>
      </div>
    </div>
    <div class="shot desk"><img src="../screenshots/admin-overview.jpg" alt="" /></div>
    <div class="shot desk2"><img src="../screenshots/admin-schedule.jpg" alt="" /></div>
    <div class="shot phone"><img src="../screenshots/mobile-home.jpg" alt="" /></div>
  </body>
</html>
