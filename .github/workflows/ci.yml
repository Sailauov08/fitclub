name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Disposable CI database credentials, not secrets.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fitclub?schema=public
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fitclub_test?schema=public
  E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fitclub_e2e?schema=public

jobs:
  check:
    name: Typecheck, lint, i18n, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fitclub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - run: npx prisma generate
        working-directory: apps/api
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: node scripts/check-i18n.mjs
      - run: npm test
      - run: npm run build

      - name: Install Playwright Chromium
        run: npm run test:e2e:install -- --with-deps
      - name: End-to-end tests
        run: node scripts/e2e.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
